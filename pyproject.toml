[project]
name = "langraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vivekanand-s-naik", email = "vivekanadsnaik.iet@srinivasuniversity.edu.in" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.1",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint>=4.2.0",
    "langsmith>=0.11.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
langraph = "langraph:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
